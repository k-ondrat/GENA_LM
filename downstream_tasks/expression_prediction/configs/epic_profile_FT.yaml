# Шаг B, FT: всё разморожено, старт с model_best этапа LP.
# PH_INIT = model_best/pytorch_model.bin этапа LP. 56 000 шагов при TBS 36 ≈ 2 эпохи (окна со сдвигом).
TASK_NAME: expression/epic_profile_FT
HOME_PATH: ${oc.env:GENALM_HOME}
MODEL_PATH_ROOT: ${HOME_PATH}/runs/${TASK_NAME}

args_params:
  _target_: builtins.dict
  init_checkpoint: ${oc.env:PH_INIT}
  reset_lr: True
  reset_optimizer: True
  reset_iteration: True
  resume: null
  model_cfg: ./data/configs/L12-H768-A12-V32k-preln.json
  model_cls: "downstream_tasks.expression_prediction.csrna_profile_head:CsRNAProfileHead"
  model_path: ${MODEL_PATH_ROOT}
  input_seq_len: 8192
  optimizer: "AdamW"
  lr: 3e-5
  weight_decay: 1e-4
  lr_scheduler: "cosine"
  num_warmup_steps: 500
  clip_grad_norm: 1
  iters: 56000
  log_interval: 50
  valid_interval: 2000
  save_interval: 2000
  save_best: True
  optimize_metric: "other_loss"      # = профильный NLL + alpha · MSE счёта тайлов (valid)
  optimize_mode: "min"
  early_stopping_patience: 10000000
  data_n_workers: 8
  seed: 45
  gen_tokenizer: "AIRI-Institute/gena-lm-bert-base-t2t"
  text_tokenizer: "Qwen/Qwen3-Embedding-0.6B"

model_kwargs:          # = epic_csrna_full.yaml + параметры головы
  _target_: builtins.dict
  hf: True
  hf_model_name: ${HOME_PATH}/models/moderngena_large_8192
  hf_model_name_decoder: ${HOME_PATH}/models/decoderdp0.1
  desc_model_name: "Qwen/Qwen3-Embedding-0.6B"
  freeze_dna_encoder: false
  loss_fct:
    _target_: torch.nn.MSELoss
    reduction: 'none'
  activation:
    _target_: torch.nn.Softplus
  config:
    _target_: builtins.dict
  weight: 1.0
  freeze_backbone: false
  base_d: 64
  token_weight: 1.0                  # вес прежнего токенного MSE
  base_tile: 1000
  alpha: 20.0                        # вес MSE log1p-счёта тайла
  count_cap: 100.0                   # макс. вес тайла в профильном NLL, ридов

shared_dataset_params:
  gen_tokenizer: ${args_params.gen_tokenizer}
  text_tokenizer: ${args_params.text_tokenizer}
  text_max_seq_len: 510
  bw: bw
  num_before: 4096
  gen_max_seq_len: 8192
  token_len_for_fetch: 15
  transform_targets_bw:
    _target_: downstream_tasks.expression_prediction.expression_dataset_final.logtransform
    pseudocount: 1
  seed: ${args_params.seed}

train_dataset_ASM119413v2_s00:
  _target_: downstream_tasks.expression_prediction.csrna_base_dataset.CsRNAProfileDataset
  max_shift: 2048
  random_shift: True
  targets_path: ${HOME_PATH}/epic_train/ASM119413v2/file_mappings_ASM119413v2.csv
  genome: ${HOME_PATH}/epic_data/ASM119413v2/genome/genome.fa
  forward_intervals_path: ${HOME_PATH}/epic_train/ASM119413v2/intervals_shift/ASM119413v2.train.forward.s00.tsv
  reverse_intervals_path: ${HOME_PATH}/epic_train/ASM119413v2/intervals_shift/ASM119413v2.train.reverse.s00.tsv
  hash_prefix: ${HOME_PATH}/epic_train/cache/full/ASM119413v2
