# Пилот дообучения full8192 на csRNA EPIC: устрица, 2000 шагов.
# Положить в downstream_tasks/expression_prediction/configs/epic_csrna_pilot.yaml
# !!! model_kwargs сверить с checkpoints/full8192/full8192.yaml и взять оттуда (кроме weight)

TASK_NAME: expression/epic_csrna_pilot
HOME_PATH: ${oc.env:GENALM_HOME}
MODEL_PATH_ROOT: ${HOME_PATH}/runs/${TASK_NAME}
A: cgigas_uk_roslin_v1
EPIC: ${HOME_PATH}/epic_train/${A}

args_params:
  _target_: builtins.dict
  init_checkpoint: ${HOME_PATH}/checkpoints/full8192/full8192_best.bin
  reset_lr: True
  reset_optimizer: True
  reset_iteration: True
  resume: null
  model_cfg: ./data/configs/L12-H768-A12-V32k-preln.json
  model_cls: "downstream_tasks.expression_prediction.expression_model_final:ExpressionCounts"
  model_path: ${MODEL_PATH_ROOT}
  input_seq_len: 8192
  optimizer: "AdamW"
  lr: 3e-5
  weight_decay: 1e-4
  lr_scheduler: "constant_with_warmup"
  num_warmup_steps: 200
  clip_grad_norm: 1
  iters: 2000
  log_interval: 50
  valid_interval: 250
  save_interval: 1000
  save_best: True
  optimize_metric: "other_loss"
  optimize_mode: "min"
  early_stopping_patience: 10000000
  data_n_workers: 8
  seed: 45
  gen_tokenizer: "AIRI-Institute/gena-lm-bert-base-t2t"
  text_tokenizer: "Qwen/Qwen3-Embedding-0.6B"

model_kwargs:
  _target_: builtins.dict
  hf: True
  hf_model_name: ${HOME_PATH}/models/moderngena_large_8192
  hf_model_name_decoder: ${HOME_PATH}/models/decoderdp0.1
  desc_model_name: "Qwen/Qwen3-Embedding-0.6B"
  freeze_dna_encoder: false          # вариант B пилота: true
  loss_fct:
    _target_: torch.nn.MSELoss
    reduction: 'none'
  activation:
    _target_: torch.nn.Softplus      # сверить с full8192.yaml
  config:
    _target_: builtins.dict
  weight: 1.0                        # CLS-лосса нет, учим только трек

shared_dataset_params:
  gen_tokenizer: ${args_params.gen_tokenizer}
  text_tokenizer: ${args_params.text_tokenizer}
  text_max_seq_len: 510
  targets_path: ${EPIC}/file_mappings_${A}.csv
  genome: ${HOME_PATH}/epic_data/${A}/genome/genome.fa
  bw: bw
  num_before: 4096                   # num_after = 8192 - 4096
  gen_max_seq_len: 8192
  token_len_for_fetch: 15
  transform_targets_bw:
    _target_: downstream_tasks.expression_prediction.expression_dataset_final.logtransform
    pseudocount: 1
  hash_prefix: ${HOME_PATH}/epic_train/cache/${A}
  seed: ${args_params.seed}

# _target_ - в каждом блоке: n_keys выводится по классу блока ДО слияния с shared_dataset_params
train_dataset_oyster:
  _target_: downstream_tasks.expression_prediction.csrna_dataset.CsRNADatasetTSSWindow
  forward_intervals_path: ${EPIC}/intervals/${A}.train.forward.tsv
  reverse_intervals_path: ${EPIC}/intervals/${A}.train.reverse.tsv

valid_dataset_oyster:
  _target_: downstream_tasks.expression_prediction.csrna_dataset.CsRNADatasetTSSWindow
  forward_intervals_path: ${EPIC}/intervals/${A}.valid.forward.tsv
  reverse_intervals_path: ${EPIC}/intervals/${A}.valid.reverse.tsv
